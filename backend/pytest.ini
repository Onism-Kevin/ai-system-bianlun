[pytest]
testpaths = tests
pythonpath = .
# -p no:cacheprovider（2026-10-13 S1-10）：禁用 pytest 缓存插件。原因（实测）：
# workspace-write 沙箱只放行工作区根及根一级子目录写入，backend/ 等子目录不可写；
# 缓存目录即便落根级，_make_cachedir 的 tempfile.mkdtemp 建出的目录在本沙箱不可
# 访问（os.listdir/chmod 报 WinError 5），建缓存必失败并告警。禁用后无 cache
# 目录、无告警；代价是不支持 --lf/--ff（本项目不依赖）。
addopts = -q -p no:cacheprovider
